global:
  scrape_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: auth
    static_configs:
      - targets: ['127.0.0.1:8081']

  - job_name: ads
    static_configs:
      - targets: ['127.0.0.1:8082']

  - job_name: search
    static_configs:
      - targets: ['127.0.0.1:8083']

  - job_name: onlineconf
    static_configs:
      - targets: ['127.0.0.1:8084']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: gateway
    static_configs:
      - targets: ['127.0.0.1:9080']
