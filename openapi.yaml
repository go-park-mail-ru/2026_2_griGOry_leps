openapi: 3.0.3
info:
  title: GO&GET API
  version: 1.1.0
  description: |
    **Соглашения**
    - Все пути начинаются с `/api` (без версии).
    - JSON, поля в snake_case. Даты — ISO 8601 (UTC).
    - Идентификаторы — целые числа (как в БД).
    - Цена и любые суммы — строка с двумя знаками после точки (`"15000.00"`), валюта всегда RUB.
    - Ошибки — плоский объект `{"error": "текст"}`, без RFC 9457 и машиночитаемых кодов.
      У ошибок валидации есть `field` — имя поля запроса; проверки идут по порядку,
      отдаётся первая сработавшая ошибка. У некоторых 409 есть дополнительные поля
      (см. схему `Error`).
    - Пагинация — `limit` (по умолчанию 24, больше 60 обрезается до 60) и `offset`.
      Ответ списка: `{"items": [], "total": 0, "limit": 24, "offset": 0}`.

    **Авторизация**
    Cookie-сессия `session_id` (httpOnly, 7 дней) выставляется при регистрации
    и при входе. Без сессии доступны только лента, справочники, страница продавца
    и просмотр объявления; остальное — 401 `not authenticated`.

    **Статусы объявления**
    `draft` → `moderation` → `active` → `closed` / `sold`. Статус меняет только
    сервер и метод `POST /listings/{id}/close`.

    **CSRF**
    Все POST/PUT/PATCH/DELETE требуют заголовок `X-CSRF-Token`, иначе 403
    `invalid csrf token`. Токен выдаёт `GET /csrf`, живёт 24 часа и привязан
    к cookie сессии, а до входа — к анонимной cookie `csrf_id`, поэтому после
    входа, регистрации и выхода токен нужно запросить заново.

    **Подтверждение почты**
    После регистрации на почту уходит ссылка `<фронт>/verify-email?token=…`, она
    действует 30 минут и срабатывает один раз. Пока почта не подтверждена
    (`email_verified` = false), нельзя публиковать объявления (`publish` = true
    в `POST /listings` и `PATCH /listings/{id}`), менять адреса доставки и жаловаться
    на продавцов — эти ручки отвечают 403 `email not verified`. Черновики, правка,
    снятие и удаление своих объявлений, профиль и пароль доступны. Сброс пароля
    по ссылке из письма тоже подтверждает почту.

    Если подтверждённую почту меняют в профиле, новая сначала попадает в
    `pending_email`, а вход и письма работают со старой, пока новую не подтвердят.

servers:
  - url: http://localhost:8080/api
    description: Локальный бэкенд
  - url: http://goget.pw:8000/api
    description: Прод

tags:
  - name: Служебное
    description: Health-check и CSRF-токен
  - name: Авторизация
    description: Регистрация, вход, выход, восстановление пароля
  - name: Профиль
    description: Свой профиль, аватарка, мои объявления, адреса доставки
  - name: Справочники
    description: Города и категории для выпадающих списков форм
  - name: Лента
    description: Список объявлений с фильтрами
  - name: Объявления
    description: Создание, просмотр, редактирование, закрытие и удаление объявлений
  - name: Продавцы
    description: Публичная страница продавца
  - name: Корзина
    description: Корзина текущего пользователя
  - name: Заказы
    description: Оформление покупки и оплата

paths:
  /health:
    get:
      tags: [Служебное]
      operationId: health
      summary: Проверка живости сервиса
      security: []
      responses:
        '200':
          description: Сервис отвечает
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOk' }

  /csrf:
    get:
      tags: [Служебное]
      operationId: getCSRFToken
      summary: CSRF-токен для изменяющих запросов
      description: |
        Если нет ни cookie сессии, ни `csrf_id`, выставляет анонимную cookie `csrf_id`
        и привязывает токен к ней.
      security: []
      responses:
        '200':
          description: Токен, который нужно передавать в заголовке `X-CSRF-Token`
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCSRFCookie' }
            Cache-Control:
              description: Всегда `no-store`, чтобы браузер и прокси не отдавали токен из кэша
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token]
                properties:
                  csrf_token: { type: string, example: 1792054800.3f9a1c0e5b7d2a4c6e8f0a1b3c5d7e9f1a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d }

  # ---------------------------------------------------------------- Авторизация
  /register:
    post:
      tags: [Авторизация]
      operationId: register
      summary: Регистрация
      description: |
        Создаёт аккаунт и сразу авторизует: выставляет cookie сессии.
        Проверки идут по порядку, отдаётся первая сработавшая ошибка.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Аккаунт создан, cookie сессии выставлена
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Невалидный JSON или не прошла валидация поля (тогда в ответе есть `field`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badBody: { value: { error: invalid request body } }
                invalidEmail: { value: { error: invalid email, field: email } }
                missingFirstName: { value: { error: first name is required, field: first_name } }
                invalidFirstName: { value: { error: 'first name must be 2-50 characters: latin or cyrillic letters, digits, spaces, -, _ and .', field: first_name } }
                invalidPhone: { value: { error: invalid phone number, field: phone } }
                weakPassword: { value: { error: 'password must be at least 8 characters and contain uppercase, lowercase letters and a digit', field: password } }
                passwordTooLong: { value: { error: password is too long, field: password } }
        '409': { $ref: '#/components/responses/EmailOrPhoneTaken' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /login:
    post:
      tags: [Авторизация]
      operationId: login
      summary: Вход по телефону или email
      description: |
        `login`, содержащий `@`, проверяется как email, иначе — как телефон.
        Возвращает пользователя и выставляет cookie сессии.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Успешный вход, выставлена cookie сессии
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequestBody' }
        '401':
          description: |
            Неверный логин или пароль. Ответ одинаковый и для несуществующего
            пользователя, и для неверного пароля.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: invalid login or password }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /logout:
    post:
      tags: [Авторизация]
      operationId: logout
      summary: Выход
      description: |
        Идемпотентно: работает и без cookie, и с уже протухшей — всегда 200
        и очищает cookie на клиенте.
      security:
        - csrfToken: []
      responses:
        '200':
          description: Сессия завершена (или её и не было)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOk' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '500': { $ref: '#/components/responses/InternalError' }

  /password/forgot:
    post:
      tags: [Авторизация]
      operationId: forgotPassword
      summary: Запросить ссылку для сброса пароля
      description: |
        Принимает email или телефон, как при входе. Если такой аккаунт есть, на его email
        уходит письмо со ссылкой `<фронт>/reset-password?token=…`. Ссылка действует 30 минут
        и срабатывает один раз.

        Ответ одинаковый, есть такой аккаунт или нет, чтобы по нему нельзя было
        проверить, зарегистрирован ли email или телефон. Новое письмо уходит не чаще раза в минуту,
        повторные запросы в течение минуты тоже отвечают 200, но письмо не отправляют.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: Запрос принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOk' }
        '400':
          description: Невалидный JSON, email или телефон
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badBody: { value: { error: invalid request body } }
                invalidLogin: { value: { error: invalid email or phone, field: login } }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /password/reset:
    get:
      tags: [Авторизация]
      operationId: checkResetToken
      summary: Проверить ссылку из письма
      description: |
        Фронт вызывает при открытии страницы `/reset-password`: если ссылка рабочая,
        показывает форму нового пароля с email аккаунта, иначе экран «Ссылка больше не действует».
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ссылка действует
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: { type: string, format: email, example: timur@mail.ru }
        '400':
          description: Ссылка устарела, уже использована или не существует
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: invalid or expired token, field: token }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Авторизация]
      operationId: resetPassword
      summary: Задать новый пароль по ссылке из письма
      description: |
        Новый пароль проверяется по тем же правилам, что при регистрации.
        После смены все ссылки сброса пользователя перестают работать, а все его сессии
        завершаются, поэтому дальше нужно войти с новым паролем.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Пароль изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOk' }
        '400':
          description: Невалидный JSON, ссылка устарела или пароль не прошёл проверку
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badBody: { value: { error: invalid request body } }
                invalidToken: { value: { error: invalid or expired token, field: token } }
                weakPassword: { value: { error: 'password must be at least 8 characters and contain uppercase, lowercase letters and a digit', field: password } }
                passwordTooLong: { value: { error: password is too long, field: password } }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- Профиль
  /email/verify:
    post:
      tags: [Авторизация]
      operationId: verifyEmail
      summary: Подтвердить почту по ссылке из письма
      description: |
        Сессия не нужна: ссылку могут открыть на другом устройстве. Ссылка срабатывает
        один раз и перестаёт работать, если email успели поменять или смену отменили.
        Для ссылки на `pending_email` новая почта становится основной (`changed` = true),
        а выданные ссылки для сброса пароля перестают работать.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200':
          description: Почта подтверждена
          content:
            application/json:
              schema:
                type: object
                required: [email, changed]
                properties:
                  email: { type: string, format: email, example: anna@goget.pw }
                  changed: { type: boolean, description: 'true, если подтвердили новую почту из профиля.' }
        '400':
          description: |
            Невалидный JSON или ссылка не работает. Если ссылка просто устарела, а почта
            всё ещё ждёт подтверждения, в ответе есть `email` — на него можно отправить новую
            ссылку через `POST /email/verify/resend-by-link`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badBody: { value: { error: invalid request body } }
                expired: { value: { error: invalid or expired token, field: token, email: anna@goget.pw } }
                unknown: { value: { error: invalid or expired token, field: token } }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '409':
          description: Почта уже подтверждена или новая почта успела достаться другому аккаунту
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                alreadyVerified: { value: { error: email already verified } }
                emailTaken: { value: { error: email already registered, field: email } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /email/verify/resend:
    post:
      tags: [Авторизация]
      operationId: resendEmailVerification
      summary: Отправить письмо для подтверждения ещё раз
      description: |
        Письмо уходит на `pending_email`, а если его нет — на неподтверждённый `email`,
        не чаще раза в минуту. Если минута не прошла — 429, в `Retry-After` сколько
        секунд осталось. Работает только ссылка из последнего письма.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Письмо отправлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '409':
          description: Почта уже подтверждена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: email already verified }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /email/verify/resend-by-link:
    post:
      tags: [Авторизация]
      operationId: resendEmailVerificationByLink
      summary: Новая ссылка вместо устаревшей
      description: |
        Для экрана «Ссылка устарела», когда сессии может не быть. Принимает токен из старой
        ссылки и отправляет новую на ту же почту, если она всё ещё ждёт подтверждения.
        Ограничения те же, что у `POST /email/verify/resend`.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200':
          description: Письмо отправлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSent' }
        '400':
          description: Невалидный JSON или ссылка ни к чему не относится
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: invalid or expired token, field: token }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '409':
          description: Почта уже подтверждена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: email already verified }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/email/pending:
    delete:
      tags: [Профиль]
      operationId: cancelEmailChange
      summary: Отменить смену почты
      description: Убирает `pending_email`, ссылки на новую почту перестают работать.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Смена отменена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '409':
          description: Смены почты нет
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: no pending email change }
        '500': { $ref: '#/components/responses/InternalError' }

  /me:
    get:
      tags: [Профиль]
      operationId: getMe
      summary: Свой профиль
      description: |
        Поля `User` (`id`, `email`, `first_name`, `phone`) остаются на месте,
        к ним добавлены поля профиля.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Профиль текущего пользователя
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Профиль]
      operationId: updateMe
      summary: Изменить профиль
      description: |
        Меняет только переданные поля, остальные не трогает. Принимаются только
        `first_name`, `phone`, `email`, `city_id`, `about`; любые другие поля игнорируются.

        При смене `city_id` сервер обновляет город для доставки; новые объявления
        получают город из профиля.

        Смена `email`:
        - почта ещё не подтверждена — заменяется сразу, на новую уходит ссылка
          для подтверждения, выданные ссылки для сброса пароля перестают работать;
        - почта подтверждена — новая записывается в `pending_email`, на неё уходит
          ссылка, а `email` меняется только после перехода по ссылке. Если новая почта
          занята другим аккаунтом — 409. Тот же email, что сейчас, отменяет смену.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400':
          description: Невалидный JSON или не прошла валидация поля
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badBody: { value: { error: invalid request body } }
                missingFirstName: { value: { error: first name is required, field: first_name } }
                invalidFirstName: { value: { error: 'first name must be 2-50 characters: latin or cyrillic letters, digits, spaces, -, _ and .', field: first_name } }
                invalidPhone: { value: { error: invalid phone number, field: phone } }
                invalidEmail: { value: { error: invalid email, field: email } }
                invalidCity: { value: { error: invalid city_id, field: city_id } }
                aboutTooLong: { value: { error: about must be at most 500 characters, field: about } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/EmailOrPhoneTaken' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/avatar:
    post:
      tags: [Профиль]
      operationId: uploadAvatar
      summary: Загрузить аватарку
      description: |
        Заменяет прежнюю аватарку; старый файл сервер удаляет сам.
        Удаления аватарки без замены нет.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/FileUpload' }
            encoding:
              file: { contentType: 'image/jpeg, image/png' }
      responses:
        '200':
          description: Аватарка заменена
          content:
            application/json:
              schema:
                type: object
                required: [avatar_url]
                properties:
                  avatar_url:
                    type: string
                    format: uri-reference
                    description: Путь на сервере API, как в `Profile.avatar_url`.
                    example: /uploads/avatars/3f2a9c1e5b7d40a8b6e1c2d3f4a5b6c7.jpg
        '400': { $ref: '#/components/responses/BadFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/password:
    put:
      tags: [Профиль]
      operationId: changePassword
      summary: Сменить пароль
      description: |
        Новый пароль проверяется по тем же правилам, что при регистрации.
        Остальные сессии пользователя завершаются, текущая остаётся.
        Выданные ссылки для сброса пароля перестают работать.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Пароль изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOk' }
        '400':
          description: Невалидный JSON или не прошла проверка поля
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badBody: { value: { error: invalid request body } }
                wrongCurrent: { value: { error: wrong current password, field: current_password } }
                weakPassword: { value: { error: 'password must be at least 8 characters and contain uppercase, lowercase letters and a digit', field: new_password } }
                passwordTooLong: { value: { error: password is too long, field: new_password } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/listings:
    get:
      tags: [Профиль]
      operationId: listMyListings
      summary: Мои объявления
      description: |
        Объявления текущего пользователя в любом статусе, сначала недавно изменённые.
        Правка, закрытие и удаление — теми же методами `/listings/{id}`.
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          description: Без параметра — все статусы.
          schema: { $ref: '#/components/schemas/ListingStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница моих объявлений
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyListingPage' }
        '400':
          description: Некорректный параметр запроса
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                status: { value: { error: invalid status } }
                limit: { value: { error: invalid limit } }
                offset: { value: { error: invalid offset } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/addresses:
    get:
      tags: [Профиль]
      operationId: listAddresses
      summary: Мои адреса доставки
      description: В порядке добавления. Если адреса есть, ровно один из них основной.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Адреса текущего пользователя
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Профиль]
      operationId: createAddress
      summary: Добавить адрес
      description: |
        Первый адрес всегда становится основным, даже при `is_default` = false.
        Новый основной адрес снимает отметку с прежнего.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressRequest' }
      responses:
        '201':
          description: Адрес добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/AddressValidation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/addresses/{address_id}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    patch:
      tags: [Профиль]
      operationId: updateAddress
      summary: Изменить адрес
      description: |
        Меняет только переданные поля. `is_default` = true делает адрес основным
        и снимает отметку с прежнего. `is_default` = false у основного адреса
        передаёт отметку самому старому из остальных; единственный адрес остаётся основным.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAddressRequest' }
      responses:
        '200':
          description: Обновлённый адрес
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/AddressValidation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '404': { $ref: '#/components/responses/AddressNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Профиль]
      operationId: deleteAddress
      summary: Удалить адрес
      description: |
        Если удалён основной адрес, основным становится самый старый из оставшихся,
        поэтому после удаления клиенту стоит заново запросить `GET /me/addresses`.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Адрес удалён
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '404': { $ref: '#/components/responses/AddressNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- Справочники
  /cities:
    get:
      tags: [Справочники]
      operationId: listCities
      summary: Поиск города
      security: []
      parameters:
        - name: query
          in: query
          description: Начало названия без учёта регистра. Без параметра — популярные города.
          schema: { type: string }
          example: Мос
      responses:
        '200':
          description: Подходящие города
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/City' }
        '500': { $ref: '#/components/responses/InternalError' }

  /categories:
    get:
      tags: [Справочники]
      operationId: listCategories
      summary: Дерево категорий
      description: В объявление пишется id листа дерева.
      security: []
      responses:
        '200':
          description: Корневые категории с вложенными
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryNode' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- Лента
  /listings:
    get:
      tags: [Лента]
      operationId: listListings
      summary: Список объявлений
      description: |
        Возвращает только активные объявления. Авторизация не нужна.
      security: []
      parameters:
        - name: q
          in: query
          description: Поиск подстроки в title и description без учёта регистра
          schema: { type: string }
        - name: category_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: city
          in: query
          description: Точное название города без учёта регистра
          schema: { type: string }
          example: Москва
        - name: price_min
          in: query
          schema: { $ref: '#/components/schemas/PriceFilter' }
        - name: price_max
          in: query
          description: Должен быть не меньше price_min, иначе 400.
          schema: { $ref: '#/components/schemas/PriceFilter' }
        - name: has_delivery
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница объявлений
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdPage' }
        '400':
          description: Некорректный параметр запроса
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                categoryId: { value: { error: invalid category_id } }
                hasDelivery: { value: { error: invalid has_delivery } }
                limit: { value: { error: invalid limit } }
                offset: { value: { error: invalid offset } }
                price: { value: { error: invalid price } }
                priceRange: { value: { error: price_max must not be less than price_min } }
                sort: { value: { error: invalid sort value } }
        '500': { $ref: '#/components/responses/InternalError' }

    # ---------------------------------------------------------------- Объявления
    post:
      tags: [Объявления]
      operationId: createListing
      summary: Создать объявление
      description: |
        Автор — текущий пользователь, город берётся из его профиля.
        Сначала клиент загружает каждое фото через `POST /listing-photos`,
        потом отправляет форму с их id.

        `publish` = true (по умолчанию) — объявление уходит в `moderation`,
        после проверки сервер переводит его в `active`. Все правила ниже обязательны.

        `publish` = false — сохраняется черновик (`draft`), проверяются только
        переданные поля.

        | Поле | Обязательно при publish | Правило |
        | --- | --- | --- |
        | `category_id` | да | существующий лист дерева категорий |
        | `title` | да | 1–80 символов |
        | `photo_ids` | да | минимум 1 |
        | `price` | да, кроме `is_free` = true | ≥ 0 |
        | `condition` | да | одно из значений `Condition` |
        | `address` | да | непустая строка |
        | `description` | нет | до 3000 символов |
        | `is_negotiable`, `is_free`, `has_delivery` | нет | по умолчанию false |
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateListingRequest' }
      responses:
        '201':
          description: Объявление создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400': { $ref: '#/components/responses/ListingValidation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '500': { $ref: '#/components/responses/InternalError' }

  /listing-photos:
    post:
      tags: [Объявления]
      operationId: uploadListingPhoto
      summary: Загрузить фото объявления
      description: |
        Одно фото за запрос, до отправки формы. Фото, не привязанное к объявлению
        в течение 24 часов, сервер удаляет. Привязать можно только свои фото.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/FileUpload' }
            encoding:
              file: { contentType: 'image/jpeg, image/png' }
      responses:
        '201':
          description: Фото загружено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedPhoto' }
        '400': { $ref: '#/components/responses/BadFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '500': { $ref: '#/components/responses/InternalError' }

  /listings/{listing_id}:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    get:
      tags: [Объявления]
      operationId: getListing
      summary: Просмотр объявления
      description: |
        | Кто и статус | Ответ |
        | --- | --- |
        | Любой, `active` | 200 |
        | Не автор, `closed` или `sold` | 200 со статусом; купить нельзя |
        | Не автор, `draft` или `moderation` | 404 |
        | Автор, любой статус | 200, `is_owner` = true, виден `close_reason` |
        | Удалённое | 404 |

        Сессия необязательна: без неё `is_owner` и `in_cart` — false.
      security:
        - {}
        - sessionCookie: []
      responses:
        '200':
          description: Объявление
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '404': { $ref: '#/components/responses/ListingNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Объявления]
      operationId: updateListing
      summary: Редактировать объявление
      description: |
        Только автор. Принимает те же поля, что и создание, любое подмножество,
        с теми же правилами для переданных полей. Непереданные поля не меняются.
        `photo_ids` заменяет список целиком: первое фото — главное, пропущенные
        удаляются. Пустой `description` убирает описание в любом статусе.

        **Черновик** (`draft`):
        - `null` в `category_id`, `price`, `condition`, `address` очищает поле,
          пустой `photo_ids` убирает все фото;
        - `publish` = true: изменения применяются, затем объявление проверяется
          по всем правилам создания с `publish` = true. Если проверка прошла —
          статус становится `moderation`, иначе 400 с полем, и ничего не сохраняется.

        **Остальные статусы**: очистить обязательное поле нельзя — `null` и пустой
        `photo_ids` дают 400 с полем. `publish` не принимается — 409.
        Статус при правке не меняется, кроме `rejected`: исправленное
        объявление снова уходит на модерацию (`moderation`).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateListingRequest' }
      responses:
        '200':
          description: Обновлённое объявление
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400': { $ref: '#/components/responses/ListingValidation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ListingNotFound' }
        '409':
          description: Проданное объявление править нельзя; `publish` — только у черновика
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                sold: { value: { error: listing is sold } }
                notDraft: { value: { error: listing is not a draft } }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Объявления]
      operationId: deleteListing
      summary: Удалить объявление
      description: |
        Только автор. Стирает объявление навсегда вместе со статистикой и убирает
        его из корзин всех пользователей. Нельзя, если по объявлению есть
        оформленный заказ.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Объявление удалено
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ListingNotFound' }
        '409':
          description: По объявлению есть активный заказ; `order_id` нужен кнопке «Перейти к заказу»
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: listing has active order, order_id: 77, order_number: 10245 }
        '500': { $ref: '#/components/responses/InternalError' }

  /listings/{listing_id}/close:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    post:
      tags: [Объявления]
      operationId: closeListing
      summary: Снять с продажи
      description: |
        Только автор. Статус становится `closed`, причину видит только автор.
        Объявление пропадает из ленты и со страницы продавца, а в чужих корзинах
        становится недоступным (`unavailable_reason` = `closed`).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseListingRequest' }
      responses:
        '200':
          description: Объявление закрыто
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400':
          description: Невалидный JSON, причины нет или она неизвестна
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badBody: { value: { error: invalid request body } }
                reason: { value: { error: invalid close reason, field: reason } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ListingNotFound' }
        '409':
          description: Закрыть можно только активное объявление
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: listing is not active }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- Продавцы
  /sellers/{seller_id}:
    parameters:
      - $ref: '#/components/parameters/SellerId'
    get:
      tags: [Продавцы]
      operationId: getSeller
      summary: Профиль продавца
      description: Публично; телефон и email продавца не передаются.
      security: []
      responses:
        '200':
          description: Профиль продавца
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProfile' }
        '404': { $ref: '#/components/responses/SellerNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /sellers/{seller_id}/listings:
    parameters:
      - $ref: '#/components/parameters/SellerId'
    get:
      tags: [Продавцы]
      operationId: listSellerListings
      summary: Активные объявления продавца
      description: |
        Только статус `active`. `total` учитывает `category_id`, а `categories`
        всегда содержит все разделы продавца без этого фильтра — сумма `count`
        и есть число на чипе «Все». Нет объявлений — 200 с `items: []`.
      security: []
      parameters:
        - name: category_id
          in: query
          description: Без параметра — «Все».
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница объявлений продавца
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerAdPage' }
        '400':
          description: Некорректный параметр запроса
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                categoryId: { value: { error: invalid category_id } }
                sort: { value: { error: invalid sort value } }
                limit: { value: { error: invalid limit } }
                offset: { value: { error: invalid offset } }
        '404': { $ref: '#/components/responses/SellerNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /sellers/{seller_id}/reviews:
    parameters:
      - $ref: '#/components/parameters/SellerId'
    get:
      tags: [Продавцы]
      operationId: listSellerReviews
      summary: Отзывы о продавце
      description: |
        Отзывы покупателей на объявления продавца. `rating` и `distribution` считаются
        по всем отзывам и не зависят от `with_photos`; `total` — с учётом `with_photos`.
        В `distribution` оценка округляется до целой звезды.
      security: []
      parameters:
        - name: sort
          in: query
          description: |
            - `newest` — сначала новые (по умолчанию)
            - `rating_desc` — сначала положительные
            - `rating_asc` — сначала отрицательные
          schema: { type: string, enum: [newest, rating_desc, rating_asc], default: newest }
        - name: with_photos
          in: query
          description: true — только отзывы с фото.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница отзывов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '400':
          description: Некорректный параметр запроса
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                sort: { value: { error: invalid sort value } }
                withPhotos: { value: { error: invalid with_photos } }
                limit: { value: { error: invalid limit } }
                offset: { value: { error: invalid offset } }
        '404': { $ref: '#/components/responses/SellerNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /sellers/{seller_id}/reports:
    parameters:
      - $ref: '#/components/parameters/SellerId'
    post:
      tags: [Продавцы]
      operationId: reportSeller
      summary: Пожаловаться на продавца
      description: |
        Жалобу видят только модераторы, продавец не узнаёт, кто её отправил.
        Не больше 5 жалоб за 10 минут с одного IP.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportSellerRequest' }
      responses:
        '204':
          description: Жалоба принята
        '400':
          description: Невалидный JSON, неизвестная причина, длинный комментарий или жалоба на себя
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badBody: { value: { error: invalid request body } }
                reason: { value: { error: invalid report reason, field: reason } }
                comment: { value: { error: comment must be at most 500 characters, field: comment } }
                self: { value: { error: cannot report yourself } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '404': { $ref: '#/components/responses/SellerNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- Корзина
  /cart:
    get:
      tags: [Корзина]
      operationId: getCart
      summary: Посмотреть корзину
      description: |
        Позиции сгруппированы по продавцам, внутри группы — новые сверху.
        Выбор позиций хранится на клиенте, итоги по выбранным клиент считает сам.
        Пустая корзина — 200 с `items_count: 0` и `groups: []`.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Корзина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cart/items:
    post:
      tags: [Корзина]
      operationId: addCartItem
      summary: Добавить объявление в корзину
      description: |
        Идемпотентно: если объявление уже в корзине, 200 без дубля.
        Тот же метод используется для «Вернуть» после удаления.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id]
              properties:
                listing_id: { type: integer, example: 1024 }
      responses:
        '200': { $ref: '#/components/responses/CartCount' }
        '400': { $ref: '#/components/responses/BadRequestBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Своё объявление в корзину добавить нельзя
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: cannot add own listing }
        '404': { $ref: '#/components/responses/ListingNotFound' }
        '409':
          description: Объявление не активно
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: listing is unavailable }
        '500': { $ref: '#/components/responses/InternalError' }

  /cart/items/{listing_id}:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    delete:
      tags: [Корзина]
      operationId: removeCartItem
      summary: Убрать объявление из корзины
      description: Идемпотентно — если объявления в корзине нет, тоже 200.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200': { $ref: '#/components/responses/CartCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cart/items/bulk-delete:
    post:
      tags: [Корзина]
      operationId: bulkRemoveCartItems
      summary: Удалить выбранные
      description: Идемпотентно; id, которых нет в корзине, пропускаются.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingIdsRequest' }
      responses:
        '200': { $ref: '#/components/responses/CartCount' }
        '400': { $ref: '#/components/responses/BadRequestBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- Заказы
  /checkout/quote:
    post:
      tags: [Заказы]
      operationId: checkoutQuote
      summary: Данные для страницы оформления
      description: |
        Принимает выбранные доступные позиции корзины. Способ получения
        выбирается отдельно для каждого продавца: если продавец не отправляет
        (`has_delivery` = false), у `courier` и `pickup_point` стоит
        `available: false`, доступен только `self_pickup`.
        Адреса — только чтение из профиля.

        «Купить сейчас» — это `POST /cart/items` и затем этот метод с одним объявлением.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingIdsRequest' }
      responses:
        '200':
          description: Всё для страницы «Оформление заказа»
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutQuote' }
        '400': { $ref: '#/components/responses/BadRequestBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/CartItemsUnavailable' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '500': { $ref: '#/components/responses/InternalError' }

  /orders:
    post:
      tags: [Заказы]
      operationId: createOrder
      summary: Оформить покупку
      description: |
        Повтор запроса с тем же `Idempotency-Key` возвращает уже созданный заказ.
        После успеха товары заказа убираются из корзины.

        - `cod` — заказ сразу `placed`, `payment.status` = `on_delivery`.
        - `card` и `sbp` — заказ `awaiting_payment`, клиент переходит на
          `payment.confirmation_url`; `placed` сервер ставит сам после
          подтверждения платежа. Без оплаты в течение часа — `cancelled`.

        | Поле | Правило |
        | --- | --- |
        | `delivery.by_seller` | по записи на каждого продавца заказа; способ должен быть `available` в `quote` |
        | `delivery.address_id` или `delivery.address` | нужен, если хотя бы у одного продавца `courier`; `address` — новый адрес, в профиль не сохраняется |
        | `delivery.date`, `delivery.time_slot` | обязательны при `courier`, из `quote.delivery_slots` |
        | `delivery.comment` | до 200 символов |
        | `recipient` | имя и телефон по правилам профиля; профиль не меняется |
        | `payment_method` | `card`, `sbp`, `cod` |
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID, сгенерированный клиентом на одну попытку оформления.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: Невалидный JSON, нет `Idempotency-Key` или не прошла валидация поля
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badBody: { value: { error: invalid request body } }
                idempotencyKey: { value: { error: invalid Idempotency-Key header } }
                bySeller: { value: { error: delivery method is not available, field: delivery.by_seller } }
                address: { value: { error: delivery address is required, field: delivery.address } }
                timeSlot: { value: { error: delivery time slot is required, field: delivery.time_slot } }
                comment: { value: { error: comment must be at most 200 characters, field: delivery.comment } }
                recipientName: { value: { error: first name is required, field: recipient.first_name } }
                recipientPhone: { value: { error: invalid phone number, field: recipient.phone } }
                paymentMethod: { value: { error: invalid payment method, field: payment_method } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/CartItemsUnavailable' }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '500': { $ref: '#/components/responses/InternalError' }

  /orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Заказы]
      operationId: getOrder
      summary: Статус заказа и оплаты
      description: |
        Заказ видит только покупатель. Пока `payment.status` = `processing`,
        клиент опрашивает этот метод.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /orders/{order_id}/payment:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Заказы]
      operationId: retryOrderPayment
      summary: Оплатить снова или другим способом
      description: Новая попытка оплаты («Попробовать снова», «Выбрать другой способ»).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { $ref: '#/components/schemas/PaymentMethod' }
      responses:
        '200':
          description: Заказ с новой попыткой оплаты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: Невалидный JSON или неизвестный способ оплаты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badBody: { value: { error: invalid request body } }
                method: { value: { error: invalid payment method, field: method } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409':
          description: Заказ уже оформлен или отменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: order is not payable }
        '403': { $ref: '#/components/responses/InvalidCSRF' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: httpOnly cookie, выставляется сервером в /register и /login.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Токен из `GET /csrf`, нужен на всех POST/PUT/PATCH/DELETE.

  headers:
    SetCSRFCookie:
      description: '`csrf_id=<hex>; Path=/; HttpOnly; SameSite=Lax` (+ `Secure`, если COOKIE_SECURE=true). Только если не было ни сессии, ни `csrf_id`.'
      schema: { type: string }
    SetSessionCookie:
      description: '`session_id=<hex>; Path=/; HttpOnly; SameSite=Lax` (+ `Secure`, если COOKIE_SECURE=true)'
      schema: { type: string }

  parameters:
    ListingId:
      name: listing_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SellerId:
      name: seller_id
      in: path
      required: true
      description: user_id продавца
      schema: { type: integer, minimum: 1 }
    AddressId:
      name: address_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Sort:
      name: sort
      in: query
      description: |
        - `newest` — сначала новые (по умолчанию, как и при пустом параметре)
        - `price_asc` / `price_desc`
      schema: { type: string, enum: [newest, price_asc, price_desc], default: newest }
    Limit:
      name: limit
      in: query
      description: По умолчанию 24, значения выше 60 обрезаются до 60.
      schema: { type: integer, minimum: 1, default: 24 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    InvalidCSRF:
      description: Нет заголовка `X-CSRF-Token`, токен протух, подделан или выдан для другой сессии
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: invalid csrf token }
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: internal error }
    BadRequestBody:
      description: Невалидный JSON
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: invalid request body }
    TooManyRequests:
      description: |
        Слишком много запросов с одного IP. Лимиты:

        | Ручка | Лимит |
        | --- | --- |
        | `POST /login` | 10 в минуту |
        | `POST /register` | 5 за 10 минут |
        | `POST /password/forgot` | 5 за 10 минут |
        | `POST /password/reset`, `PUT /me/password` | 10 за 10 минут, общий счётчик |
        | `POST /email/verify` | 10 за 10 минут |
        | `POST /email/verify/resend`, `POST /email/verify/resend-by-link` | 5 за 10 минут, общий счётчик, плюс не чаще раза в минуту на аккаунт |

        Счётчик обнуляется через окно после первого запроса.
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос
          schema: { type: integer, example: 42 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: too many requests }
    Unauthorized:
      description: Cookie нет, она протухла или сессия удалена — во всех случаях один и тот же текст
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not authenticated }
    Forbidden:
      description: Действие доступно только автору объявления
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: forbidden }
    ListingNotFound:
      description: Объявления нет, оно удалено или скрыто от текущего пользователя
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: listing not found }
    SellerNotFound:
      description: Продавца нет или он заблокирован
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: seller not found }
    AddressNotFound:
      description: Адреса нет или он чужой
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: address not found }
    AddressValidation:
      description: Невалидный JSON или не прошла проверка поля
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            badBody: { value: { error: invalid request body } }
            missingStreet: { value: { error: street is required, field: street } }
            longStreet: { value: { error: street must be at most 200 characters, field: street } }
            missingHouse: { value: { error: house is required, field: house } }
            longHouse: { value: { error: house must be at most 50 characters, field: house } }
            longComment: { value: { error: comment must be at most 200 characters, field: comment } }
    OrderNotFound:
      description: Заказа нет или он чужой
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: order not found }
    EmailOrPhoneTaken:
      description: Email или телефон уже заняты другим аккаунтом
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            email: { value: { error: email already registered, field: email } }
            phone: { value: { error: phone already registered, field: phone } }
    BadFile:
      description: Нет части `file`, файл повреждён или картинка больше 4096×4096 пикселей
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            missing: { value: { error: file is required, field: file } }
            broken: { value: { error: invalid image, field: file } }
            tooBig: { value: { error: image resolution must be at most 4096x4096, field: file } }
    FileTooLarge:
      description: Файл больше 5 МБ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: file is too large }
    UnsupportedMediaType:
      description: Файл не JPG и не PNG
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: unsupported media type }
    ListingValidation:
      description: Невалидный JSON или не прошла валидация поля
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            badBody: { value: { error: invalid request body } }
            category: { value: { error: invalid category_id, field: category_id } }
            title: { value: { error: title must be 1-80 characters, field: title } }
            photos: { value: { error: at least one photo is required, field: photo_ids } }
            photoId: { value: { error: invalid photo id, field: photo_ids } }
            description: { value: { error: description must be at most 3000 characters, field: description } }
            price: { value: { error: invalid price, field: price } }
            condition: { value: { error: invalid condition, field: condition } }
            address: { value: { error: address is required, field: address } }
    CartCount:
      description: Число позиций в корзине после операции
      content:
        application/json:
          schema:
            type: object
            required: [items_count]
            properties:
              items_count: { type: integer, example: 3 }
    CartItemsUnavailable:
      description: Часть объявлений уже недоступна; их id в `listing_ids`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: cart items are unavailable, listing_ids: [1024, 1031] }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: invalid request body }
        field:
          type: string
          description: |
            Есть только у ошибок валидации — имя поля запроса, к которому относится
            ошибка. Вложенные поля через точку: `delivery.time_slot`, `recipient.phone`.
          example: email
        listing_ids:
          type: array
          items: { type: integer }
          description: Только у 409 `cart items are unavailable` — недоступные объявления.
        order_id:
          type: integer
          description: Только у 409 `listing has active order`.
        order_number:
          type: integer
          description: Только у 409 `listing has active order`.
        email:
          type: string
          format: email
          description: Только у 400 `invalid or expired token` из `POST /email/verify` — почта, на которую можно отправить новую ссылку.

    StatusOk:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }

    Price:
      type: string
      pattern: '^\d{1,10}\.\d{2}$'
      example: '15000.00'

    PriceFilter:
      type: string
      pattern: '^\d{1,10}(\.\d{1,2})?$'

    # ------------------------------------------------ Пользователь и профиль
    User:
      type: object
      required: [id, email, first_name, phone, email_verified]
      properties:
        id: { type: integer, example: 42 }
        email: { type: string, format: email, example: ivan@mail.ru }
        first_name: { type: string, example: Иван }
        phone: { type: string, example: '+79001234567' }
        email_verified:
          type: boolean
          description: Подтверждён ли текущий `email`.

    Profile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [pending_email, phone_verified, city, about, avatar_url, rating, reviews_count, created_at]
          properties:
            first_name:
              description: «Имя или никнейм», виден покупателям и продавцам.
            pending_email:
              type: string
              format: email
              nullable: true
              description: Новая почта, которая ждёт подтверждения. null, если смены нет.
            phone_verified: { type: boolean }
            city:
              type: object
              nullable: true
              description: null, пока пользователь не выбрал город.
              required: [id, name]
              properties:
                id: { type: integer, example: 1 }
                name: { type: string, example: Москва }
            about: { type: string, maxLength: 500, example: 'Продаю вещи после переезда' }
            avatar_url:
              type: string
              format: uri-reference
              nullable: true
              description: |
                Путь на сервере API, например `/uploads/avatars/3f2a….jpg`.
                Полный адрес — origin API плюс этот путь (`http://goget.pw:8000/uploads/avatars/…`).
              example: /uploads/avatars/3f2a9c1e5b7d40a8b6e1c2d3f4a5b6c7.jpg
            rating: { type: number, format: float, minimum: 0, maximum: 5, example: 4.9 }
            reviews_count: { type: integer, example: 23 }
            created_at: { type: string, format: date-time, description: Дата регистрации. }

    UpdateProfileRequest:
      type: object
      description: Любое подмножество полей.
      properties:
        first_name:
          type: string
          description: Те же правила, что при регистрации.
          example: timur_v
        phone:
          type: string
          description: Те же правила, что при регистрации.
          example: '+79001234567'
        email: { type: string, format: email, example: timur@mail.ru }
        city_id: { type: integer, example: 1 }
        about: { type: string, maxLength: 500, description: Может быть пустой строкой. }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, description: 'Те же правила, что при регистрации.' }

    RegisterRequest:
      type: object
      required: [email, password, first_name, phone]
      properties:
        email: { type: string, format: email, example: ivan@mail.ru }
        password:
          type: string
          format: password
          minLength: 8
          description: |
            Минимум 8 символов, заглавная и строчная буквы, хотя бы одна цифра.
            Не длиннее 72 байт (ограничение bcrypt), иначе 400 `password is too long`.
          example: Secret123
        first_name:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '^[A-Za-zА-Яа-яЁё0-9_. -]+$'
          description: Латиница, кириллица, цифры, пробел, `-`, `_` и `.`. Пробелы по краям обрезаются, несколько подряд схлопываются в один. Не уникально — одинаковые имена у разных пользователей допустимы.
          example: Иван
        phone:
          type: string
          description: |
            Российский номер в любом привычном виде: `+7 900 123-45-67`, `89001234567`,
            `9001234567`. Сервер приводит его к `+79001234567`, иначе 400 `invalid phone number`.
          example: '+7 900 123-45-67'

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Email (если содержит `@`) или телефон в любом из форматов, что и при регистрации.
          example: '+7 900 123-45-67'
        password: { type: string, format: password, example: Secret123 }

    ForgotPasswordRequest:
      type: object
      required: [login]
      properties:
        login:
          type: string
          description: Email (если содержит `@`) или телефон в любом из форматов, что и при регистрации.
          example: timur@mail.ru

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: Параметр `token` из ссылки в письме.
          example: 9f2c4e7a1b3d5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8
        password: { type: string, format: password, example: NewSecret1 }

    EmailSent:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, description: Куда ушло письмо., example: anna@goget.pw }

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Параметр `token` из ссылки в письме.
          example: 9f2c4e7a1b3d5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8

    FileUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: JPG или PNG, до 5 МБ.

    # ------------------------------------------------ Справочники
    City:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Москва }

    CategoryNode:
      type: object
      required: [id, name, slug, children]
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: Спорт и отдых }
        slug: { type: string, example: sport }
        children:
          type: array
          description: Пустой массив у листа.
          items: { $ref: '#/components/schemas/CategoryNode' }

    # ------------------------------------------------ Лента и карточки
    AdCard:
      type: object
      description: Карточка объявления в ленте, на странице продавца и в «Моих объявлениях».
      required: [id, title, price, is_free, image_url, city, has_delivery, category_id, created_at]
      properties:
        id: { type: integer, example: 1024 }
        title: { type: string, example: 'Велосипед горный, состояние отличное' }
        price:
          type: string
          pattern: '^\d{1,10}\.\d{2}$'
          example: '15000.00'
          nullable: true
          description: '"0.00" при `is_free`. null только в «Моих объявлениях» у черновика без цены.'
        is_free: { type: boolean, description: «Отдам даром». }
        image_url:
          type: string
          format: uri-reference
          nullable: true
          description: Главное фото; null, если фото нет.
        city: { type: string, example: Москва }
        has_delivery: { type: boolean }
        category_id: { type: integer }
        created_at: { type: string, format: date-time }

    AdPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdCard' }
        total: { type: integer, description: 'Всего объявлений по фильтру, без учёта limit/offset.' }
        limit: { type: integer }
        offset: { type: integer }

    SellerAdPage:
      allOf:
        - $ref: '#/components/schemas/AdPage'
        - type: object
          required: [categories]
          properties:
            categories:
              type: array
              description: Все разделы продавца без учёта `category_id`, для чипов.
              items:
                type: object
                required: [id, name, count]
                properties:
                  id: { type: integer, example: 3 }
                  name: { type: string, example: Спорт и отдых }
                  count: { type: integer, example: 10 }

    MyAdCard:
      allOf:
        - $ref: '#/components/schemas/AdCard'
        - type: object
          required: [status, close_reason, updated_at]
          properties:
            status: { $ref: '#/components/schemas/ListingStatus' }
            close_reason:
              type: string
              enum: [sold_on_goget, sold_elsewhere, changed_mind, other]
              nullable: true
            updated_at: { type: string, format: date-time }

    MyListingPage:
      type: object
      required: [items, total, limit, offset, counts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MyAdCard' }
        total: { type: integer, description: С учётом фильтра `status`. }
        limit: { type: integer }
        offset: { type: integer }
        counts:
          type: object
          description: Числа на вкладках, не зависят от `status`.
          required: [all, draft, moderation, rejected, active, closed, sold]
          properties:
            all: { type: integer, example: 7 }
            draft: { type: integer, example: 1 }
            moderation: { type: integer, example: 1 }
            rejected: { type: integer, example: 0 }
            active: { type: integer, example: 4 }
            closed: { type: integer, example: 1 }
            sold: { type: integer, example: 0 }

    # ------------------------------------------------ Объявление
    ListingStatus:
      type: string
      enum: [draft, moderation, rejected, active, closed, sold]
      description: |
        «Черновик», «На проверке», «Отклонено», «Активно», «Закрыто», «Продано».
        `rejected` ставит модерация вместо `active`.
        `sold` ставит система после завершения сделки.

    CloseReason:
      type: string
      enum: [sold_on_goget, sold_elsewhere, changed_mind, other]
      description: |
        - `sold_on_goget` — Продал на GoGET
        - `sold_elsewhere` — Продал в другом месте
        - `changed_mind` — Передумал продавать
        - `other` — Другая причина

    Condition:
      type: string
      enum: [new, used_good, used_repair]
      description: «Новое», «Б/у, состояние хорошее», «Б/у, требует ремонта».

    UploadedPhoto:
      type: object
      required: [id, url, thumb_url]
      properties:
        id: { type: integer, example: 501 }
        url: { type: string, format: uri-reference }
        thumb_url: { type: string, format: uri-reference }

    ListingPhoto:
      allOf:
        - $ref: '#/components/schemas/UploadedPhoto'
        - type: object
          required: [is_main]
          properties:
            is_main: { type: boolean, description: true у первого фото. }

    SellerShort:
      type: object
      required: [id, first_name, avatar_url, rating, reviews_count, created_at]
      properties:
        id: { type: integer, example: 42 }
        first_name: { type: string, example: Анна }
        avatar_url: { type: string, format: uri-reference, nullable: true }
        rating: { type: number, format: float, example: 4.8 }
        reviews_count: { type: integer, example: 56 }
        created_at: { type: string, format: date-time, description: Дата регистрации. }

    Listing:
      type: object
      required:
        - id
        - title
        - category
        - description
        - photos
        - price
        - is_free
        - is_negotiable
        - condition
        - city
        - address
        - has_delivery
        - attributes
        - status
        - close_reason
        - seller
        - is_owner
        - in_cart
        - published_at
        - created_at
        - updated_at
      description: |
        У черновика поля, которые ещё не заполнены, приходят null
        (`category`, `price`, `condition`, `address`) или пустыми.
      properties:
        id: { type: integer, example: 1024 }
        title: { type: string, minLength: 1, maxLength: 80, example: 'Велосипед горный Stels Navigator 29"' }
        category:
          type: object
          nullable: true
          required: [id, name, path]
          properties:
            id: { type: integer, example: 12 }
            name: { type: string, example: Велосипеды }
            path: { type: string, example: 'Спорт и отдых › Велосипеды' }
        description: { type: string, maxLength: 3000 }
        photos:
          type: array
          description: Первое фото — главное.
          items: { $ref: '#/components/schemas/ListingPhoto' }
        price:
          type: string
          pattern: '^\d{1,10}\.\d{2}$'
          example: '15000.00'
          nullable: true
          description: '"0.00" при `is_free`.'
        is_free: { type: boolean }
        is_negotiable: { type: boolean, description: «Торг уместен». }
        condition:
          type: string
          enum: [new, used_good, used_repair]
          nullable: true
        city: { type: string, example: Москва, description: Из профиля автора на момент создания. }
        address: { type: string, nullable: true, example: 'Москва, м. Сокол' }
        has_delivery: { type: boolean, description: «Готов отправить через доставку». }
        attributes:
          type: array
          description: Характеристики по категории, только чтение.
          items:
            type: object
            required: [key, name, value]
            properties:
              key: { type: string, example: brand }
              name: { type: string, example: Бренд }
              value: { type: string, example: Stels }
        status: { $ref: '#/components/schemas/ListingStatus' }
        close_reason:
          type: string
          enum: [sold_on_goget, sold_elsewhere, changed_mind, other]
          nullable: true
          description: Видна только автору, остальным всегда null.
        seller: { $ref: '#/components/schemas/SellerShort' }
        is_owner: { type: boolean, description: 'true, если запрос от автора.' }
        in_cart: { type: boolean, description: 'true, если объявление в корзине текущего пользователя; без сессии false.' }
        published_at:
          type: string
          format: date-time
          nullable: true
          description: null, пока объявление не стало активным.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ListingFields:
      type: object
      description: Поля объявления, общие для создания и правки.
      properties:
        category_id: { type: integer, example: 12 }
        title: { type: string, minLength: 1, maxLength: 80 }
        photo_ids:
          type: array
          minItems: 1
          description: Порядок задаёт порядок фото, первое — главное. Заменяет список целиком.
          items: { type: integer }
          example: [501, 502, 503]
        description: { type: string, maxLength: 3000 }
        price: { $ref: '#/components/schemas/PriceFilter' }
        is_free: { type: boolean, description: 'Если true, сервер ставит price = 0.' }
        is_negotiable: { type: boolean }
        condition: { $ref: '#/components/schemas/Condition' }
        address: { type: string, minLength: 1 }
        has_delivery: { type: boolean }

    UpdateListingRequest:
      type: object
      description: |
        Любое подмножество полей. У черновика `null` очищает поле, а `photo_ids`
        может быть пустым — см. описание `PATCH /listings/{listing_id}`.
      properties:
        category_id: { type: integer, nullable: true, example: 12 }
        title: { type: string, minLength: 1, maxLength: 80 }
        photo_ids:
          type: array
          description: Порядок задаёт порядок фото, первое — главное. Заменяет список целиком. Пустой — только у черновика.
          items: { type: integer }
          example: [501, 502, 503]
        description: { type: string, maxLength: 3000 }
        price:
          type: string
          pattern: '^\d{1,10}(\.\d{1,2})?$'
          nullable: true
        is_free: { type: boolean, description: 'Если true, сервер ставит price = 0.' }
        is_negotiable: { type: boolean }
        condition:
          type: string
          enum: [new, used_good, used_repair]
          nullable: true
        address: { type: string, minLength: 1, nullable: true }
        has_delivery: { type: boolean }
        publish:
          type: boolean
          description: Только для черновика. true — применить изменения и отправить на модерацию.
      example:
        title: 'Велосипед горный Stels Navigator 29"'
        address: null
        publish: false

    CreateListingRequest:
      allOf:
        - $ref: '#/components/schemas/ListingFields'
        - type: object
          properties:
            publish:
              type: boolean
              default: true
              description: true — на модерацию, false — черновик.
      example:
        category_id: 12
        title: 'Велосипед горный Stels Navigator 29"'
        photo_ids: [501, 502, 503]
        description: Велосипед в отличном состоянии…
        price: '15000'
        is_negotiable: true
        is_free: false
        condition: used_good
        address: 'Москва, м. Сокол'
        has_delivery: true
        publish: true

    CloseListingRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/CloseReason' }

    # ------------------------------------------------ Продавец
    SellerProfile:
      allOf:
        - $ref: '#/components/schemas/SellerShort'
        - type: object
          required: [location, phone_verified, completed_sales_count, active_listings_count]
          properties:
            location: { type: string, example: 'Москва, м. Сокол' }
            phone_verified: { type: boolean }
            completed_sales_count: { type: integer, example: 140 }
            active_listings_count: { type: integer, example: 12 }

    Review:
      type: object
      required: [id, author, rating, text, listing_title, photos, created_at]
      properties:
        id: { type: integer, example: 31 }
        author:
          type: object
          required: [id, first_name, avatar_url]
          properties:
            id: { type: integer, example: 77 }
            first_name: { type: string, example: Анна }
            avatar_url: { type: string, format: uri-reference, nullable: true }
        rating: { type: number, minimum: 1, maximum: 5, example: 5 }
        text: { type: string, description: 'Пустая строка, если покупатель поставил только оценку.' }
        listing_title:
          type: string
          nullable: true
          example: Велосипед Stels
          description: Название объявления на момент отзыва. Отзыв остаётся и после удаления объявления.
        photos:
          type: array
          description: Пустой массив, если фото нет.
          items: { type: string, format: uri-reference }
        created_at: { type: string, format: date-time }

    ReviewPage:
      type: object
      required: [items, total, limit, offset, rating, distribution]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        total: { type: integer, description: С учётом `with_photos`. }
        limit: { type: integer }
        offset: { type: integer }
        rating: { type: number, example: 4.8, description: 'Средняя оценка по всем отзывам, 0 без отзывов.' }
        distribution:
          type: object
          description: Число отзывов на каждую звезду, все ключи есть всегда.
          required: ['1', '2', '3', '4', '5']
          properties:
            '1': { type: integer, example: 1 }
            '2': { type: integer, example: 1 }
            '3': { type: integer, example: 2 }
            '4': { type: integer, example: 8 }
            '5': { type: integer, example: 44 }

    ReportSellerRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [fraud, prohibited, rude, other]
          description: |
            - `fraud` — Мошенничество
            - `prohibited` — Продаёт запрещённые товары
            - `rude` — Грубость или оскорбления
            - `other` — Другое
        comment: { type: string, maxLength: 500, description: Пробелы по краям обрезаются. }

    # ------------------------------------------------ Адреса
    Address:
      type: object
      required: [id, street, house, comment, is_default]
      properties:
        id: { type: integer, example: 1 }
        street: { type: string, maxLength: 200, example: 'Москва, ул. Тверская' }
        house: { type: string, maxLength: 50, example: 'д. 12, кв. 34' }
        comment: { type: string, maxLength: 200, example: Домофон 34 }
        is_default: { type: boolean }

    UpdateAddressRequest:
      type: object
      description: Любое подмножество полей; пробелы по краям обрезаются.
      properties:
        street: { type: string, minLength: 1, maxLength: 200 }
        house: { type: string, minLength: 1, maxLength: 50 }
        comment: { type: string, maxLength: 200 }
        is_default: { type: boolean }

    AddressRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateAddressRequest'
        - type: object
          required: [street, house]

    # ------------------------------------------------ Корзина
    ListingIdsRequest:
      type: object
      required: [listing_ids]
      properties:
        listing_ids:
          type: array
          minItems: 1
          items: { type: integer }
          example: [1024, 1031]

    CartItem:
      type: object
      required: [listing_id, title, price, image_url, address, delivery_from, availability, unavailable_reason]
      description: У удалённого объявления заполнены только `listing_id`, `availability` и `unavailable_reason`, остальное null.
      properties:
        listing_id: { type: integer, example: 1024 }
        title: { type: string, nullable: true }
        price:
          type: string
          pattern: '^\d{1,10}\.\d{2}$'
          example: '15000.00'
          nullable: true
          description: null у недоступной позиции.
        image_url: { type: string, format: uri-reference, nullable: true }
        address: { type: string, nullable: true, example: 'Москва, м. Сокол' }
        delivery_from:
          type: string
          pattern: '^\d{1,10}\.\d{2}$'
          example: '15000.00'
          nullable: true
          description: Минимальная цена доставки; null, если продавец не отправляет или позиция недоступна.
        availability: { type: string, enum: [available, unavailable] }
        unavailable_reason:
          type: string
          enum: [sold, closed, deleted]
          nullable: true

    Cart:
      type: object
      required: [items_count, groups]
      properties:
        items_count: { type: integer, example: 3 }
        groups:
          type: array
          items:
            type: object
            required: [seller, items]
            properties:
              seller:
                type: object
                required: [id, first_name, avatar_url, rating]
                properties:
                  id: { type: integer }
                  first_name: { type: string, example: Анна }
                  avatar_url: { type: string, format: uri-reference, nullable: true }
                  rating: { type: number, format: float, example: 4.8 }
              items:
                type: array
                items: { $ref: '#/components/schemas/CartItem' }

    # ------------------------------------------------ Оформление и заказ
    DeliveryMethod:
      type: string
      enum: [courier, pickup_point, self_pickup]

    PaymentMethod:
      type: string
      enum: [card, sbp, cod]
      description: '`card` — картой онлайн, `sbp` — СБП, `cod` — при получении.'

    OrderItem:
      type: object
      required: [listing_id, seller_id, title, price, image_url]
      properties:
        listing_id: { type: integer }
        seller_id: { type: integer }
        title: { type: string }
        price: { $ref: '#/components/schemas/Price' }
        image_url: { type: string, format: uri-reference, nullable: true }

    Recipient:
      type: object
      required: [first_name, phone]
      properties:
        first_name: { type: string, example: Тимур }
        phone: { type: string, example: '+79001234567' }

    CheckoutQuote:
      type: object
      required: [items, items_total, sellers, addresses, delivery_slots, recipient, payment_methods]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        items_total: { $ref: '#/components/schemas/Price' }
        sellers:
          type: array
          items:
            type: object
            required: [seller_id, first_name, items_count, delivery_methods]
            properties:
              seller_id: { type: integer }
              first_name: { type: string, example: Анна }
              items_count: { type: integer, example: 2 }
              delivery_methods:
                type: array
                items:
                  type: object
                  required: [method, price, available, hint]
                  properties:
                    method: { $ref: '#/components/schemas/DeliveryMethod' }
                    price: { $ref: '#/components/schemas/Price' }
                    available: { type: boolean }
                    hint: { type: string, example: Курьер привезёт по адресу }
        addresses:
          type: array
          description: Адреса из профиля, только чтение.
          items:
            type: object
            required: [id, label, text, is_default]
            properties:
              id: { type: integer }
              label: { type: string, example: Дом · основной }
              text: { type: string, example: 'Москва, ул. Тверская, 12, кв. 34' }
              is_default: { type: boolean }
        delivery_slots:
          type: object
          required: [dates, times]
          properties:
            dates:
              type: array
              items: { type: string, format: date }
              example: ['2026-10-15', '2026-10-16', '2026-10-17']
            times:
              type: array
              items: { type: string }
              example: ['10:00-14:00', '14:00-18:00', '18:00-22:00']
        recipient:
          allOf: [{ $ref: '#/components/schemas/Recipient' }]
          description: Подставляется из профиля.
        payment_methods:
          type: array
          items:
            type: object
            required: [method]
            properties:
              method: { $ref: '#/components/schemas/PaymentMethod' }

    OrderDelivery:
      type: object
      required: [by_seller]
      properties:
        by_seller:
          type: array
          items:
            type: object
            required: [seller_id, method]
            properties:
              seller_id: { type: integer }
              method: { $ref: '#/components/schemas/DeliveryMethod' }
        address_id: { type: integer, nullable: true, description: Адрес из `quote.addresses`. }
        address:
          type: object
          nullable: true
          description: Новый адрес, в профиль не сохраняется. Передаётся вместо `address_id`.
          required: [text]
          properties:
            text: { type: string }
        date: { type: string, format: date, nullable: true, example: '2026-10-15' }
        time_slot: { type: string, nullable: true, example: '10:00-14:00' }
        comment: { type: string, maxLength: 200, example: Позвоните за 20 минут }

    CreateOrderRequest:
      type: object
      required: [listing_ids, delivery, recipient, payment_method]
      properties:
        listing_ids:
          type: array
          minItems: 1
          items: { type: integer }
        delivery: { $ref: '#/components/schemas/OrderDelivery' }
        recipient: { $ref: '#/components/schemas/Recipient' }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }

    Order:
      type: object
      required: [id, number, status, pay_until, items, totals, delivery, payment, created_at]
      properties:
        id: { type: integer, example: 77 }
        number: { type: integer, example: 10245, description: «Заказ № 10245». }
        status:
          type: string
          enum: [awaiting_payment, placed, cancelled]
          description: |
            `placed` — заказ оформлен, продавцам ушло уведомление.
            `awaiting_payment` ждёт оплаты 1 час, после — `cancelled`.
        pay_until:
          type: string
          format: date-time
          nullable: true
          description: До какого момента можно оплатить.
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        totals:
          type: object
          required: [items, delivery, total]
          description: Считает сервер.
          properties:
            items: { $ref: '#/components/schemas/Price' }
            delivery: { $ref: '#/components/schemas/Price' }
            total: { $ref: '#/components/schemas/Price' }
        delivery:
          allOf:
            - $ref: '#/components/schemas/OrderDelivery'
            - type: object
              required: [address_text]
              properties:
                address_text:
                  type: string
                  nullable: true
                  description: Текст выбранного адреса; null без курьера.
        payment:
          type: object
          required: [method, status, confirmation_url]
          properties:
            method: { $ref: '#/components/schemas/PaymentMethod' }
            status:
              type: string
              enum: [pending, processing, paid, failed, on_delivery]
              description: |
                `processing` — экран «Оплата в процессе», `failed` — «Оплата не прошла»,
                `on_delivery` — оплата при получении.
            confirmation_url:
              type: string
              format: uri
              nullable: true
              description: Куда перенаправить для `card` и `sbp`; null для `cod`.
        created_at: { type: string, format: date-time }
